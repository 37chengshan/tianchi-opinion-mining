### LLaMA-Factory LoRA config for the ACOS quadruple task (cloud GPU)
### Mirrors the public recipe that reached 0.75 (Qwen3-4B) and 0.78 (Qwen2.5-7B)
### on this exact competition: lr 1e-4 cosine+warmup, rank 16 / alpha 32,
### dropout 0.05, cutoff 1024, batch 4 x grad-accum 8, 3 epochs, bf16.

### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
template: qwen
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset  (run scripts/prepare_llamafactory_data.py first and point dataset_dir at its output)
dataset: acos_quadruple
eval_dataset: acos_quadruple_eval
dataset_dir: ./lf_data
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: ./saves/acos_qwen25_7b_lora
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 25
max_grad_norm: 1.0
bf16: true
seed: 42
do_eval: true
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 200
