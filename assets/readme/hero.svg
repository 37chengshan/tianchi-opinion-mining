<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">tianchi-opinion-mining — ACOS 四元组抽取，线上 0.7162 → 0.7734</title>
  <desc id="heroDesc">左侧为项目名、中文说明与四元组结构标记；右侧为线上 Leaderboard 阶梯图：0.7162 起点经 0.7583、0.7645、0.7668 到 0.7734 冠军。</desc>

  <defs>
    <linearGradient id="panelFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151d29"/>
      <stop offset="1" stop-color="#0e141d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="26" fill="#0b0f14"/>

  <!-- title block (max width 560) -->
  <g id="title-block" transform="translate(64 52)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#4f8cff" letter-spacing="2">TIANCHI TRACK 6 · ACOS EXTRACTION</text>

    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="52" font-weight="700" fill="#eef3f8">tianchi-opinion-mining</text>

    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#c8d3e0">从中文电商评论抽取四元组：</text>
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" fill="#c8d3e0">Aspect · Opinion · Category · Polarity</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21" fill="#93a1b1">one-stage span/relation · fold-safe 评估 · 概率级融合</text>

    <!-- motif: the quadruple itself -->
    <g id="quadruple-motif" transform="translate(0 214)">
      <text x="0" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#5c6b7d">⟨</text>
      <g transform="translate(22 0)">
        <rect width="106" height="38" rx="10" fill="#121822" stroke="#26313f" stroke-width="1.5"/>
        <text x="53" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="19" fill="#eef3f8">方面</text>
      </g>
      <g transform="translate(140 0)">
        <rect width="106" height="38" rx="10" fill="#121822" stroke="#26313f" stroke-width="1.5"/>
        <text x="53" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="19" fill="#eef3f8">观点</text>
      </g>
      <g transform="translate(258 0)">
        <rect width="106" height="38" rx="10" fill="#121822" stroke="#26313f" stroke-width="1.5"/>
        <text x="53" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="19" fill="#eef3f8">类别</text>
      </g>
      <g transform="translate(376 0)">
        <rect width="106" height="38" rx="10" fill="#121822" stroke="#26313f" stroke-width="1.5"/>
        <text x="53" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="19" fill="#ffb454">极性</text>
      </g>
      <text x="492" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#5c6b7d">⟩</text>
    </g>

    <text x="0" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#93a1b1">python 3.12 · MPS / ROCm · 116 tests passed</text>
  </g>

  <!-- proof panel: real leaderboard ladder -->
  <g id="proof-panel" transform="translate(672 44)">
    <rect width="464" height="312" rx="18" fill="url(#panelFade)" stroke="#1e2836" stroke-width="1.5"/>
    <text x="28" y="40" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="21" font-weight="600" fill="#eef3f8">线上 Leaderboard 轨迹</text>
    <text x="28" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#5c6b7d">strict quadruple F1 · 8 次评测提交</text>

    <!-- guides -->
    <g stroke="#1b2430" stroke-width="1">
      <line x1="28" y1="132" x2="436" y2="132"/>
      <line x1="28" y1="188" x2="436" y2="188"/>
      <line x1="28" y1="244" x2="436" y2="244"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#3f4b5a">
      <text x="28" y="126">0.775</text>
      <text x="28" y="182">0.750</text>
      <text x="28" y="238">0.725</text>
    </g>

    <!-- step line: local x 96 → 412, y from 258 down to 176 -->
    <path d="M 96 258 L 175 222 L 254 200 L 333 192 L 412 164"
          fill="none" stroke="#4f8cff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#4f8cff">
      <circle cx="96" cy="258" r="6"/>
      <circle cx="175" cy="222" r="6"/>
      <circle cx="254" cy="200" r="6"/>
      <circle cx="333" cy="192" r="6"/>
    </g>
    <circle cx="412" cy="164" r="9" fill="#47d18a"/>
    <circle cx="412" cy="164" r="17" fill="none" stroke="#47d18a" stroke-opacity="0.35" stroke-width="2"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#93a1b1">
      <text x="96" y="284" text-anchor="middle">0.7162</text>
      <text x="175" y="212" text-anchor="middle">0.7583</text>
      <text x="254" y="190" text-anchor="middle">0.7645</text>
      <text x="341" y="182" text-anchor="middle">0.7668</text>
    </g>
    <text x="412" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#47d18a">0.7734</text>
    <text x="412" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="16" fill="#47d18a">4 源融合 · 冠军</text>
    <text x="96" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif" font-size="16" fill="#5c6b7d">RBT3 起点</text>
  </g>
</svg>
