      <text x="292" y="0">+ 长训练成员</text>
      <text x="432" y="0">四源融合</text>
    </g>
    <g>
      <rect x="0" y="14" width="120" height="8" rx="4" fill="#26313f"/>
      <rect x="164" y="14" width="152" height="8" rx="4" fill="#2f4a7a"/>
      <rect x="356" y="14" width="170" height="8" rx="4" fill="#3c6bb5"/>
      <rect x="562" y="14" width="204" height="8" rx="4" fill="#47d18a"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
      <text x="0" y="58" fill="#93a1b1">0.7162</text>
