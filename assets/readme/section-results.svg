  <rect x="48" y="42" width="4" height="56" rx="2" fill="#ffb454"/>

  <text x="76" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#ffb454" letter-spacing="2">EVIDENCE</text>
