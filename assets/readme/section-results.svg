<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="srTitle srDesc">
  <title id="srTitle">章节：证据</title>
  <desc id="srDesc">章节标题「成绩链与失败清单同等重要」，右侧为真实线上 Leaderboard 阶梯：RBT3 0.7162、WWM 5 折 0.7583、加长训练成员 0.7668、四源融合 0.7734。</desc>

